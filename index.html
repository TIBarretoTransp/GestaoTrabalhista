<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gestão Trabalhista · Barreto Transportes</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="assets/icone.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="shell" id="shell">
    <aside class="lateral" id="lateral" hidden>
      <a class="lateral-logo" href="#/inicio"><img src="assets/logo.png" alt="Barreto Transportes"></a>
      <div class="lateral-sub">Gestão Trabalhista</div>
      <nav class="menu" id="menu"></nav>
      <div class="lateral-rodape">
        <div class="eu" id="eu"></div>
        <button class="btn btn-fantasma btn-pequeno" id="sair">Sair</button>
      </div>
    </aside>
    <div class="principal">
      <header class="barra-movel" id="barra-movel" hidden>
        <button class="btn btn-fantasma" id="abrir-menu" aria-label="Menu">☰</button>
        <img src="assets/logo.png" alt="Barreto Transportes">
      </header>
      <main id="app" class="conteudo"><p class="carregando">Carregando…</p></main>
    </div>
  </div>
  <div id="avisos" class="avisos" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
